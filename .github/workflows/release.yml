name: Publication

# Crée une version : git tag v0.4.1 && git push origin v0.4.1
on:
  push:
    tags: ["v*"]
  workflow_dispatch:   # construction manuelle (sans publication) pour tester

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q -W error::RuntimeWarning

  build:
    needs: tests
    name: Application ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-latest       # Apple Silicon (M1 et suivants)
            label: macOS-AppleSilicon
          - os: macos-15-intel     # Mac Intel (macos-13 retiré en décembre 2025)
            label: macOS-Intel
          - os: ubuntu-22.04
            label: Linux
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Outil de diagnostic
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/report.sh" <<'SH'
          # usage : report.sh <titre> <fichier> — publie la fin du journal comme annotation d'erreur
          python - "$1" "$2" <<'PY'
          import sys
          title, path = sys.argv[1], sys.argv[2]
          try:
              txt = open(path, encoding="utf-8", errors="replace").read()[-6000:]
          except OSError as e:
              txt = str(e)
          print(f"::error title={title}::" + txt.replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
          PY
          SH
      - name: Dépendances
        id: deps
        shell: bash
        run: python -m pip install ".[gui,desktop]" pyinstaller > deps.log 2>&1 || { bash "$RUNNER_TEMP/report.sh" dependances deps.log; exit 1; }
      - name: Construction (PyInstaller)
        id: build
        shell: bash
        run: python packaging/build.py > build.log 2>&1 || { bash "$RUNNER_TEMP/report.sh" pyinstaller build.log; exit 1; }
      - name: Chemin de l'exécutable
        id: exe
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) echo "path=dist/OpenPLS/OpenPLS.exe" >> "$GITHUB_OUTPUT" ;;
            macOS)   echo "path=dist/OpenPLS.app/Contents/MacOS/OpenPLS" >> "$GITHUB_OUTPUT" ;;
            *)       echo "path=dist/OpenPLS/OpenPLS" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Vérification du serveur intégré
        id: launch
        shell: bash
        run: |
          "${{ steps.exe.outputs.path }}" --serve 8765 > launch.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8765/_stcore/health > /dev/null; then echo "serveur OK"; break; fi
            sleep 2
          done
          cp ~/.openpls/serveur.log serveur.log 2>/dev/null || true
          curl -sf http://localhost:8765/_stcore/health || { bash "$RUNNER_TEMP/report.sh" serveur serveur.log; exit 1; }
          if grep -qi traceback serveur.log; then bash "$RUNNER_TEMP/report.sh" traceback serveur.log; exit 1; fi
      - name: Autotest de la fenêtre (Windows)
        id: selftest_win
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath (Resolve-Path "${{ steps.exe.outputs.path }}") -ArgumentList "--selftest" -Wait -PassThru
          $res = Get-Content "$HOME\.openpls\selftest.json" -ErrorAction SilentlyContinue
          "code=$($p.ExitCode) resultat=$res" | Tee-Object selftest.log
          Get-Content "$HOME\.openpls\openpls.log" -ErrorAction SilentlyContinue | Add-Content selftest.log
          if ($p.ExitCode -ne 0) { bash "$env:RUNNER_TEMP/report.sh" fenetre selftest.log; exit 1 }
          echo "::notice title=Fenetre Windows::$res"
      - name: Autotest de la fenêtre (macOS)
        id: selftest_mac
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set +e
          "${{ steps.exe.outputs.path }}" --selftest; code=$?   # délais internes : 120 s serveur + 90 s page
          { echo "code=$code resultat=$(cat ~/.openpls/selftest.json 2>/dev/null)"; cat ~/.openpls/openpls.log 2>/dev/null; } > selftest.log
          [ "$code" = 0 ] || { bash "$RUNNER_TEMP/report.sh" fenetre selftest.log; exit 1; }
          echo "::notice title=Fenetre macOS::$(cat ~/.openpls/selftest.json)"
      - name: Version
        id: v
        shell: bash
        run: echo "version=$(python -c 'import openpls; print(openpls.__version__)')" >> "$GITHUB_OUTPUT"
      - name: Installateur Windows (Inno Setup)
        id: inno
        if: runner.os == 'Windows'
        run: |
          choco install innosetup -y --no-progress > inno.log 2>&1
          iscc /DAppVersion=${{ steps.v.outputs.version }} packaging\openpls.iss >> inno.log 2>&1
          if ($LASTEXITCODE -ne 0) { bash "$env:RUNNER_TEMP/report.sh" innosetup inno.log; exit 1 }
      - name: Archive macOS / Linux
        id: archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd dist
          NAME=OpenPLS-${{ steps.v.outputs.version }}-${{ matrix.label }}
          if [ "$RUNNER_OS" = "macOS" ]; then
            ditto -c -k --keepParent OpenPLS.app "$NAME.zip"
          else
            cp ../packaging/LISEZMOI.txt OpenPLS/
            tar czf "$NAME.tar.gz" OpenPLS
          fi
      - name: Diagnostic en cas d'échec
        if: failure()
        shell: bash
        run: |
          echo "deps=${{ steps.deps.outcome }} build=${{ steps.build.outcome }} launch=${{ steps.launch.outcome }} fenetre=${{ steps.selftest_win.outcome }}${{ steps.selftest_mac.outcome }} inno=${{ steps.inno.outcome }} archive=${{ steps.archive.outcome }}" > outcomes.log
          ls -la dist dist/OpenPLS 2>&1 | head -40 >> outcomes.log || true
          bash "$RUNNER_TEMP/report.sh" etapes outcomes.log || true
          for f in serveur.log selftest.log build.log inno.log; do [ -f "$f" ] && bash "$RUNNER_TEMP/report.sh" "$f" "$f"; done; true
      - uses: actions/upload-artifact@v4
        with:
          name: OpenPLS-${{ matrix.label }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artefacts/*
          generate_release_notes: true
          body: |
            ## Installation

            | Système | Fichier | Installation |
            |---|---|---|
            | Windows 10/11 | `OpenPLS-…-Windows-installateur.exe` | double-clic, puis suivre l'assistant ; OpenPLS apparaît dans le menu Démarrer |
            | Mac M1, M2, M3… | `OpenPLS-…-macOS-AppleSilicon.zip` | double-clic pour décompresser, puis glisser OpenPLS dans Applications |
            | Mac Intel | `OpenPLS-…-macOS-Intel.zip` | idem |
            | Linux | `OpenPLS-…-Linux.tar.gz` | décompresser, puis lancer `OpenPLS` (s'ouvre dans le navigateur) |

            OpenPLS s'ouvre dans sa propre fenêtre. **Tout reste sur votre ordinateur** : vos données ne sont envoyées nulle part.

            **Premier lancement** — l'application n'est pas encore signée par Microsoft ou Apple :
            - Windows : si « Windows a protégé votre ordinateur » s'affiche, cliquez « Informations complémentaires » puis « Exécuter quand même ».
            - macOS : si macOS refuse d'ouvrir OpenPLS, allez dans Réglages Système → Confidentialité et sécurité, puis cliquez « Ouvrir quand même » en bas de la page.
