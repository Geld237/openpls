[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openpls"
version = "0.7.5"
description = "Implémentation libre du PLS-SEM (Partial Least Squares Structural Equation Modeling)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.22", "pandas>=1.4", "scipy>=1.8"]

[project.optional-dependencies]
gui = ["streamlit>=1.65", "openpyxl>=3.1", "jinja2>=3", "altair>=5", "matplotlib>=3.6"]
desktop = ["pywebview>=5"]
dev = ["pytest>=7", "streamlit>=1.65", "openpyxl>=3.1", "jinja2>=3", "altair>=5", "matplotlib>=3.6"]

[project.scripts]
openpls-gui = "openpls.gui:main"

[tool.setuptools]
packages = ["openpls"]

[tool.setuptools.package-data]
openpls = ["editor/*.html", "static/*", "static/fonts/*", ".streamlit/config.toml", "style.css"]
