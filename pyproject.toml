[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openpls"
version = "0.1.0"
description = "Implémentation libre du PLS-SEM (Partial Least Squares Structural Equation Modeling)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "pandas>=1.4", "scipy>=1.8"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["openpls"]
